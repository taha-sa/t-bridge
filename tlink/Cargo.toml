[package]
name = "tlink"
version = "0.1.0"
edition = "2024"
description = "T-Suite T-Link (PROTOCOL.md v1): kayit defteri okuyucu, istemci ve sunucu (Windows named pipe)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util"] }
log = "0.4"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
]

[dev-dependencies]
tempfile = "3"
