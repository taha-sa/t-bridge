[package]
name = "tbridge-vcam"
version = "0.1.0"
edition = "2024"
description = "T-Bridge sanal kamera: Frame Server icinde calisan MF medya kaynagi (IMFMediaSourceEx), COM in-proc DLL"

[lib]
name = "tbridge_vcam"
crate-type = ["cdylib"]

[dependencies]
kopru-camring = { path = "../ring" }

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_Media",
  "Win32_Media_MediaFoundation",
  "Win32_Media_KernelStreaming",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
]

[dependencies.windows-core]
version = "0.62"
