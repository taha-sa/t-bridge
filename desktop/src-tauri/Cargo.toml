[package]
name = "kopru-desktop"
version = "0.3.5"
description = "T-Bridge masaüstü"
edition = "2024"
rust-version = "1.90"

[lib]
name = "kopru_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
kopru-core = { path = "../../core" }
tlink = { path = "../../tlink" }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"
log = "0.4"
regex = "1"
anyhow = "1"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time", "sync"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Media_Audio",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Shutdown",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  # Ekran paylaşımı: Windows.Graphics.Capture / DXGI / D3D11 / Media Foundation
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_Com",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_Media_MediaFoundation",
  "Win32_System_Variant",
  "Win32_System_Com_StructuredStorage",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Wdk_System_SystemServices",
  "Win32_System_SystemInformation",
] }
