[package]
name = "kopru-desktop"
version = "0.1.0"
description = "Köprü masaüstü"
edition = "2024"
rust-version = "1.90"

[lib]
name = "kopru_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

