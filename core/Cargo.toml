[package]
name = "kopru-core"
version = "0.3.1"
edition = "2024"
description = "Köprü ortak çekirdeği: QUIC bağlantı, eşleştirme, pano, dosya aktarımı"

[lib]
name = "kopru_core"
crate-type = ["lib", "cdylib"]

[dependencies]
uniffi = { version = "0.32" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util", "fs"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
mdns-sd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
blake3 = "1"
thiserror = "2"
rand = "0.9"
if-addrs = "0.13"
anyhow = "1"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[dev-dependencies]
tempfile = "3"
blake3 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]
